name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    # The one OS matrix for this workflow; the example job reuses it as *os-matrix.
    strategy: &os-matrix
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: Python 3.9, the helper's floor, has no Ubuntu 26.04 build.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Unit tests for herdr_tools.py
        run: python -m unittest discover -s herdr/scripts -p 'test_*.py' -v

  example:
    strategy: *os-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: herdr/examples/full
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Tests for the full example's scripts, hook and checks
        run: npm test

  retry-workflow:
    # The retry workflow only runs on ubuntu, from main; this tests its retry step on every PR.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tests for the retry-unacquired workflow
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
