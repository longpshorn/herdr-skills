name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests for herdr_tools.py
        run: python3 -m unittest discover -s herdr/scripts -p 'test_*.py' -v
