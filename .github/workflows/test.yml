name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    # The one OS matrix for this workflow; the example job reuses it as *os-matrix.
    strategy: &os-matrix
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Python 3.9, the helper's floor, from uv on every OS; the activated venv puts it first on PATH.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.9"
          activate-environment: true
      - name: Python under test
        run: python -c "import sys; print(sys.version); assert sys.version_info[:2] == (3, 9), sys.version"
      - name: Unit tests for herdr_tools.py
        run: python -m unittest discover -s herdr/scripts -p 'test_*.py' -v

  example:
    strategy: *os-matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: herdr/examples/full
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Tests for the full example's scripts, hook and checks
        run: npm test

  retry-workflow:
    # The retry workflow only runs on ubuntu, from main; this tests its retry step on every PR.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Tests for the retry-unacquired workflow
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
