name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  helper:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Unit tests for herdr_tools.py
        run: python -m unittest discover -s herdr/scripts -p 'test_*.py' -v
